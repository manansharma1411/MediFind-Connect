openapi: 3.1.0
info:
  title: MediFind Connect Core API
  description: >
    Official API contract for MediFind Connect — The collaborative intelligence network for medicine access.
    Maintained by Person B (Backend Architect) for frontend integration by Person A.

    Status Legend:
    - [OPERATIONAL]: Implemented and live in production.
    - [PLANNED]: Proposed contract for upcoming backend phases; NOT yet implemented.
  version: 1.0.0
  contact:
    name: MediFind Connect Architecture Team (Person B)

servers:
  - url: https://medifind-connect-vh5s.onrender.com
    description: Production Render Server
  - url: http://localhost:5000
    description: Local Development Server

tags:
  - name: System (Operational)
    description: Live health and connectivity probes
  - name: Medicine Discovery (Operational)
    description: Public search, details, availability, and price comparison endpoints
  - name: Pharmacy Management (Operational)
    description: Authenticated pharmacy profile, operating hours, dashboard, inventory, and alerts endpoints
  - name: Collaboration (Operational)
    description: Authenticated pharmacy-to-pharmacy stock discovery and atomic transfer lifecycle endpoints
  - name: Intelligence (Planned)
    description: Privacy-preserving demand, shortage radar, and smart restock

paths:
  # ============================================================================
  # OPERATIONAL ENDPOINTS (CONFIRMED LIVE IN BACKEND)
  # ============================================================================
  /api/health:
    get:
      tags:
        - System (Operational)
      summary: '[OPERATIONAL] Liveness and service health probe'
      description: >
        Confirms that the Express API process is running cleanly.
        Verified in backend/src/app.ts and backend/src/routes/health.ts.
        Never exposes database credentials or secrets.
      operationId: getApiHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseEnvelope'

  /health:
    get:
      tags:
        - System (Operational)
      summary: '[OPERATIONAL] Liveness probe (root alias)'
      description: >
        Root alias for GET /api/health, mounted at / in backend/src/app.ts
        for frontend health-badge compatibility.
      operationId: getRootHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseEnvelope'

  /api/readiness:
    get:
      tags:
        - System (Operational)
      summary: '[OPERATIONAL] Database readiness probe'
      description: >
        Implemented and tested in backend/src/controllers/healthController.ts.
        Queries Supabase PostgreSQL (medicines table count) and reports status: "ready"
        when connected or "degraded" if credentials/tables are missing.
      operationId: getApiReadiness
      responses:
        '200':
          description: Readiness check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponseEnvelope'

  /readiness:
    get:
      tags:
        - System (Operational)
      summary: '[OPERATIONAL] Database readiness probe (root alias)'
      description: Root alias for GET /api/readiness, mounted at / in backend/src/app.ts.
      operationId: getRootReadiness
      responses:
        '200':
          description: Readiness check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponseEnvelope'

  # ============================================================================
  # MEDICINE DISCOVERY (OPERATIONAL)
  # ============================================================================
  /api/v1/medicines:
    get:
      tags:
        - Medicine Discovery (Operational)
      summary: '[OPERATIONAL] Search and list medicines'
      description: Ranked search across generic names, brand names, prefix/partial matches, and trigram typo suggestions.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query (e.g., "paracetamol")
        - name: form
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of medicines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessEnvelope'

  /api/v1/medicines/{id}:
    get:
      tags:
        - Medicine Discovery (Operational)
      summary: '[OPERATIONAL] Retrieve medicine details'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Medicine details
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/medicines/{id}/availability:
    get:
      tags:
        - Medicine Discovery (Operational)
      summary: '[OPERATIONAL] Retrieve nearby pharmacies stocking a medicine'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radiusKm
          in: query
          schema:
            type: number
            default: 10
      responses:
        '200':
          description: Nearby availability sorted by distance

  /api/v1/medicines/{id}/prices:
    get:
      tags:
        - Medicine Discovery (Operational)
      summary: '[OPERATIONAL] Retrieve medicine price comparisons across pharmacies'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Price comparison list (MRP vs Selling Price in INR)

  # ============================================================================
  # PHARMACY MANAGEMENT (OPERATIONAL - AUTHENTICATED /me/*)
  # ============================================================================
  /api/v1/pharmacies:
    post:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Register pharmacy profile for authenticated user'
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Pharmacy registered (verificationStatus PENDING)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Duplicate pharmacy registration

  /api/v1/pharmacies/me:
    get:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Retrieve authenticated user authorized pharmacy profile'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authorized InternalPharmacy profile
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Update permitted pharmacy profile fields'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile updated

  /api/v1/pharmacies/me/operating-hours:
    get:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Retrieve pharmacy IST operating hours'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Weekly schedule
    put:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Update pharmacy IST operating hours'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Operating hours updated

  /api/v1/pharmacies/me/dashboard:
    get:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Retrieve pharmacy dashboard metrics and recent movements'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Real inventory metrics and audit movements

  /api/v1/pharmacies/me/alerts:
    get:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Retrieve low-stock, out-of-stock, near-expiry, and expired alerts'
      security:
        - BearerAuth: []
      parameters:
        - name: nearExpiryDays
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Alerts list and summary counts

  /api/v1/pharmacies/me/inventory:
    get:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] List, search, filter, and paginate private pharmacy inventory'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paginated PrivateInventoryItem list
    post:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Add a medicine batch to pharmacy inventory'
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Batch added and INITIAL_STOCK audit logged

  /api/v1/pharmacies/me/inventory/{itemId}:
    get:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Retrieve single inventory item details'
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory item details
    put:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Update inventory item metadata (prices, threshold, expiry)'
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory item updated

  /api/v1/pharmacies/me/inventory/{itemId}/adjust:
    post:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Perform atomic stock adjustment with immutable audit log'
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stock adjusted atomically
        '409':
          description: INSUFFICIENT_STOCK (negative stock prevented)

  /api/v1/pharmacies/me/inventory/{itemId}/history:
    get:
      tags:
        - Pharmacy Management (Operational)
      summary: '[OPERATIONAL] Retrieve stock movement audit history for an item'
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chronological movement history

  # ============================================================================
  # COLLABORATION / STOCK TRANSFERS (OPERATIONAL)
  # ============================================================================
  /api/v1/collaboration/stock:
    get:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] Discover eligible stock at other pharmacies for transfer'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paginated list of eligible stock (no exact quantities or wholesale costs)

  /api/v1/collaboration/transfers:
    get:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] List incoming and outgoing transfers for authorized pharmacy'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paginated transfers list
    post:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] Create a new stock transfer request'
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Transfer created in REQUESTED state

  /api/v1/collaboration/transfers/{transferId}:
    get:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] Retrieve transfer details and immutable audit history'
      security:
        - BearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer details and event history

  /api/v1/collaboration/transfers/{transferId}/approve:
    post:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] Approve transfer and atomically reserve stock (supports Idempotency-Key)'
      security:
        - BearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved and stock reserved
        '409':
          description: INSUFFICIENT_STOCK or INVALID_STATE_TRANSITION

  /api/v1/collaboration/transfers/{transferId}/reject:
    post:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] Reject transfer request with mandatory reason'
      security:
        - BearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked REJECTED

  /api/v1/collaboration/transfers/{transferId}/dispatch:
    post:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] Dispatch an approved transfer'
      security:
        - BearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked DISPATCHED

  /api/v1/collaboration/transfers/{transferId}/receive:
    post:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] Confirm receipt, settle reservations, and record discrepancies'
      security:
        - BearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked RECEIVED

  /api/v1/collaboration/transfers/{transferId}/cancel:
    post:
      tags:
        - Collaboration (Operational)
      summary: '[OPERATIONAL] Cancel REQUESTED or APPROVED transfer and release reserved stock'
      security:
        - BearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked CANCELLED
        '409':
          description: INVALID_STATE_TRANSITION (e.g., DISPATCHED cannot be cancelled)

  # ============================================================================
  # DEMAND & AI INTELLIGENCE (PLANNED)
  # ============================================================================
  /api/v1/intelligence/demand-summary:
    get:
      tags:
        - Intelligence (Planned)
      summary: '[PLANNED] Retrieve privacy-preserving regional demand summaries'
      security:
        - BearerAuth: []
      parameters:
        - name: area
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Aggregated area demand metrics (Zero PII)

  /api/v1/intelligence/shortage-radar:
    get:
      tags:
        - Intelligence (Planned)
      summary: '[PLANNED] Retrieve explainable Shortage Radar risk signals'
      security:
        - BearerAuth: []
      parameters:
        - name: area
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [LOW, MODERATE, ELEVATED, CRITICAL]
      responses:
        '200':
          description: Shortage alerts with evidence and confidence intervals

  /api/v1/intelligence/restock-recommendations:
    get:
      tags:
        - Intelligence (Planned)
      summary: '[PLANNED] Retrieve Smart Restock reorder recommendations for pharmacy'
      security:
        - BearerAuth: []
      parameters:
        - name: pharmacyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reorder recommendations with statistical rationale

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth Bearer JWT token.

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorEnvelope'
    Forbidden:
      description: User lacks permission to access this pharmacy resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorEnvelope'
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorEnvelope'

  schemas:
    TransferStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, DISPATCHED, RECEIVED, CANCELLED]

    GenericSuccessEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    StandardErrorEnvelope:
      type: object
      required: [success, error, timestamp]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
              example: The requested endpoint does not exist.
            details:
              type: object
              nullable: true
        timestamp:
          type: string
          format: date-time

    HealthResponseEnvelope:
      type: object
      required: [success, status, service, message, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: ok
        service:
          type: string
          example: backend
        message:
          type: string
          example: MediFind Connect API is running
        data:
          type: object
          properties:
            status:
              type: string
              example: ok
            app:
              type: string
              example: MediFind Connect API
            version:
              type: string
              example: 1.0.0
            environment:
              type: string
              example: production
            timestamp:
              type: string
              format: date-time
        timestamp:
          type: string
          format: date-time

    ReadinessResponseEnvelope:
      type: object
      required: [success, status, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          enum: [ready, degraded]
        data:
          type: object
          properties:
            status:
              type: string
              enum: [ready, degraded]
            database:
              type: object
              properties:
                configured:
                  type: boolean
                connected:
                  type: boolean
                latencyMs:
                  type: integer
                message:
                  type: string
        timestamp:
          type: string
          format: date-time
